# Build dod3-recomp for AVX (non-AVX2) — CLOUD RUNNER variant.
#
# PERBEDAAN DARI VARIAN SELF-HOSTED (build-avx.yml):
#   Varian ini jalan di windows-latest (runner ephemeral Microsoft) dan
#   download EBOOT dari URL yang diisi di kolom input tiap run (default
#   kosong, tidak tersimpan di file), lalu upload
#   hasil build sebagai artifact GitHub. Itu pilihan sadar dengan trade-off:
#
#   - EBOOT (file game 26 MB) DI-DOWNLOAD ke disk VM runner Microsoft selama
#     build. Lifter butuh file di disk, bukan stream RAM. Hapus setelah build
#     tidak menghapus snapshot/swap/log/backup infra di sisi mereka.
#   - dod3.exe hasil build (berisi lifted game code) DI-UPLOAD sebagai
#     artifact ke server GitHub. Di repo PUBLIK, artifact bisa di-download
#     siapa pun yang punya link run-nya; di repo PRIVAT hanya kolaborator.
#   - Karena itu: pakai varian ini HANYA di FORK PRIVAT, jangan di repo
#     publik. Jangan pernah taruh URL EBOOT di file ini (lihat bawah).
#
# EBOOT_URL = INPUT TIAP RUN, DEFAULT KOSONG
#   Kolom input eboot_url ada lagi, tapi default-nya KOSONG — tidak ada link
#   apa pun yang tersimpan di file ini. Tiap kali Run workflow, isi kolom itu
#   dengan link download langsung EBOOT_101.ELF (Dropbox: ...?dl=1).
#   Kenapa default kosong: workflow file yang ke-commit ikut ke repo; kalau
#   ada link di default-nya dan repo-nya publik (atau jadi publik nanti),
#   link-nya ikut publik — siapa pun bisa download EBOOT-nya.
#   Catatan: workflow_dispatch inputs BUKAN secret — nilai yang diisi tampil
#   di log run dan di API, tidak di-mask (beda dengan secret yang di-mask).
#   Makanya varian cloud ini tetap HANYA untuk FORK PRIVAT. Kalau input
#   kosong, workflow gagal di awal dengan pesan yang jelas.
#
# PERBAIKAN DARI DRAF AWAL (yang bikin build gagal / lolos diam-diam):
#   1. venv WAJIB dibuat. tools/lift_spu.sh tidak punya fallback ke system
#      python: isinya PY=.venv/bin/python, kalau tidak ada -> PY=
#      .venv/Scripts/python.exe, lalu dieksekusi begitu saja. Tanpa .venv,
#      Lift SPU gagal "No such file or directory" walau Lift PPU (yang pakai
#      system python) lolos. Di sini: buat .venv sekali, pip install ke
#      .venv, Lift PPU + Lift SPU sama-sama pakai .venv.
#   2. Validasi EBOOT fail-fast. Draf awal cuma Write-Warning kalau ukuran
#      beda dan cuma print SHA tanpa dibandingin — file HTML error Dropbox
#      (atau file salah) akan lolos ke lift dan gagal di sana dengan pesan
#      yang membingungkan. Di sini: ukuran != 26872424 -> Error + exit 1;
#      prefix SHA-256 != ed89e80f2336a948 -> Error + exit 1.
#   3. Package continue-on-error: true. Runner cloud itu ephemeral: kalau
#      package_win.sh gagal (mis. Redist tidak ketemu) dan step-nya
#      gagal, job berhenti dan upload tidak pernah jalan — build yang sudah
#      1-2 jam hilang begitu saja. Dengan continue-on-error, dod3.exe tetap
#      ke-upload walau zip-nya gagal dibuat.
#   4. Verify ditambah cek CMakeCache DOD3_X86_LEVEL == input (bukan cuma
#      cek string gate). Kalau cache-nya ternyata v3, ketahuan di sini,
#      bukan pas sudah jalan di i7-2600.
#   5. SDL2 not found di Configure (run pertama, 2026-10-19): find_package
#      (SDL2 QUIET) di ps3recomp/CMakeLists.txt:153 tidak menemukan SDL2
#      walau step vcpkg lolos. Dua kemungkinan (log step vcpkg tidak ikut
#      di screenshot): vcpkg install gagal diam-diam (PowerShell tidak
#      menggagalkan step atas exit code native command) ATAU prefix vcpkg
#      tidak terekspos ke CMake. Fix: cek $LASTEXITCODE + verifikasi
#      SDL.h/SDL2Config.cmake di step vcpkg, dan -DCMAKE_PREFIX_PATH
#      eksplisit di Configure (obat yang disarankan pesan error-nya).
#   6. v3 (run kedua masih gagal error identik, 2026-10-19): run kedua
#      (ID beda) gagal sama persis, jadi perlu bukti file mana yang jalan.
#      v3 tambah (a) step "Workflow version marker" yang nge-print versi
#      workflow di log — kalau step itu tidak ada di suatu run, berarti run
#      itu pakai file lama; (b) -DSDL2_DIR=<prefix>/share/sdl2 untuk memaksa
#      lookup Config-mode; (c) echo VCPKG_ROOT / CMAKE_PREFIX_PATH /
#      SDL2_DIR di log Configure. Pastikan paste ter-commit + dispatch run
#      BARU (Re-run run lama memakai file dari commit lama, edit yang belum
#      di-commit juga tidak kepakai).
#   7. v4 (v3 jalan tapi tetap gagal, 2026-10-19): log Configure run v3
#      MEMBUKTIKAN v3 yang jalan (baris echo VCPKG_ROOT / CMAKE_PREFIX_PATH
#      / SDL2_DIR ada) + verifikasi vcpkg lolos (job sampai Configure) +
#      VCPKG_ROOT = vcpkg bawaan VS 18 (C:\Program Files\Microsoft Visual
#      Studio\18\Enterprise\VC\vcpkg, bukan C:\vcpkg) — tapi find_package
#      tetap NOT FOUND. Jadi bukan file hilang / path salah, tapi pencarian
#      find_package-nya sendiri: ps3recomp memanggil find_package(SDL2
#      QUIET) tanpa CONFIG, jadi CMake mencoba Module mode (FindSDL2.cmake)
#      dulu, dan kalau Module mode gagal, Config mode tidak dicoba — SDL2_DIR
#      + CMAKE_PREFIX_PATH (petunjuk Config) jadi tidak kepakai. v4:
#      -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON (paksa Config mode dulu) +
#      --debug-find-pkg=SDL2 (log pencarian; kalau masih gagal, log-nya yang
#      kasih jawaban) + step debug list file SDL2 (continue-on-error:
#      diagnostik tidak boleh menggagalkan build).
#   8. v5 (v4 ketemu akar sebenarnya, 2026-10-19): file TER-COMMIT di repo
#      sudah v4 penuh (verifikasi vcpkg ada — dicek langsung dari GitHub),
#      dan run v4-nya menunjukkan PARADOKS: step vcpkg lolos verifikasi
#      (Test-Path menemukan SDL2Config.cmake) TAPI step debug beberapa
#      menit kemudian bilang share/sdl2 TIDAK ADA di prefix yang sama.
#      Jadi file SDL2 ada saat step vcpkg, hilang saat Configure — prefix
#      vcpkg bawaan VS 18 (VC\vcpkg\installed) tidak bisa dipercaya
#      untuk bertahan antar-step (VS mengelolanya sebagai cache).
#      v5: JANGAN PAKAI vcpkg bawaan VS. Clone vcpkg sendiri ke
#      C:\vcpkg-dod3 (di luar jangkauan VS), bootstrap, install, verifikasi
#      — semua pakai clone itu. MSVC step dipindah ke awal (sebelum vcpkg)
#      agar bootstrap + vcpkg menemukan compiler VS. Configure tambah
#      verifikasi SDL2Config.cmake tepat sebelum cmake (fail-fast kalau
#      prefix-nya kosong).
#   9. v6 (v5: BUILD SUKSES, Verify yang gagal — 2026-10-19): run v5
#      (39195108210, 27m2s) membuktikan clone vcpkg bekerja: Configure
#      menemukan SDL2, Build jalan 20m10s dan lolos, CMakeCache level
#      = x86-64-v2, string gate AVX2 tidak ada. Yang gagal hanya step
#      Verify Binary: ia print "Verifikasi lolos" lalu exit code 1.
#      Penyebabnya: findstr exit 1 saat string TIDAK ditemukan (= hasil
#      yang diinginkan), dan PowerShell mengembalikan $LASTEXITCODE sebagai
#      exit code script — jadi kode 1 itu bocor dan menggagalkan step
#      walau semua cek lolos. v6: tangkap hasil findstr ke variabel,
#      reset $LASTEXITCODE = 0, dan akhiri step Verify dengan exit 0
#      eksplisit. Satu-satunya native command di Verify adalah findstr,
#      jadi ini menutup semua jalur bocor di step itu.
#  10. v7 (exe jalan tapi error DLL runtime hilang — 2026-10-19): artifact
#      run v6 hanya berisi dod3.exe telanjang -> saat dijalankan, Windows
#      error karena SDL2.dll / zlib1.dll / VC redist tidak ada di sebelah
#      exe. Penyebab ganda: (a) Upload hanya meng-upload dod3.exe (+
#      dist/*.zip kalau ada); (b) package_win.sh kemungkinan gagal
#      diam-diam (continue-on-error) karena glob-nya hardcode
#      Microsoft.VC143.CRT — di VS 18 foldernya bisa VC144/VC145 — jadi
#      tidak ada zip. v7: step baru "Stage runtime DLLs" (setelah Build,
#      sebelum Verify) meng-copy SDL2.dll + zlib1.dll dari bin vcpkg +
#      CRT DLL (msvcp140, vcruntime140, vcruntime140_1) dari folder
#      Microsoft.VC*.CRT apa pun + dod3.ini ke build-avx/; Verify tambah
#      cek DLL (SDL2/zlib wajib ada, CRT warning kalau hilang); Upload
#      tambah build-avx/*.dll + build-avx/dod3.ini. Artifact GitHub
#      di-download sebagai zip, jadi isinya langsung satu set yang bisa
#      jalan (exe + DLL + ini). package_win.sh tetap jalan (continue-
#      on-error) — kalau glob VC143-nya cocok, bonus zip dist ikut
#      ke-upload; kalau tidak, artifact loose tetap lengkap.
#  11. v8 (staging gagal: zlib1.dll tidak ada di bin vcpkg — 2026-10-19):
#      run v7 (39222328545, 43m37s): Build lolos (31m40s), staging gagal
#      karena C:\vcpkg-dod3\installed\x64-windows\bin\zlib1.dll tidak
#      ada (padahal SDL2.dll ada di bin yang sama). Fendi mengonfirmasi
#      exe-nya memang manggil DLL zlib (build awal juga manggil z.dll),
#      jadi gagal keras di staging itu BENAR — masalahnya cuma nama file
#      DLL zlib-nya bukan zlib1.dll (vcpkg bisa menghasilkan zlib.dll).
#      v8: nama DLL zlib TIDAK di-hardcode — cari pola zlib*.dll di
#      build-avx/ (hasil applocal vcpkg) dulu, lalu di bin vcpkg, copy
#      apa pun yang ketemu; gagal keras kalau tidak ketemu di keduanya.
#      Verify juga cek pola zlib*.dll, bukan nama zlib1.dll. Log run v8
#      (baris "Staged zlib...") akan menunjukkan nama sebenarnya.
#
# CARA PAKAI
#   1. Fork privat soyjxck/dod3-recomp. Paste file ini manual di web UI ke
#      .github/workflows/build-avx-cloud.yml (GitHub App tidak punya
#      permission Workflows).
#   2. Actions > Build dod3 (AVX) - Cloud Runner > Run workflow, isi kolom
#      eboot_url dengan link download langsung EBOOT_101.ELF (Dropbox
#      ...?dl=1). Kolomnya default kosong — link tidak tersimpan di file.
#   3. Setelah selesai, download artifact dari halaman run-nya. Artifact
#      kedaluwarsa (default 90 hari) — simpan zip-nya ke disk sendiri.

name: Build dod3 (AVX) - Cloud Runner

on:
  workflow_dispatch:
    inputs:
      eboot_url:
        description: "Direct download URL ke EBOOT_101.ELF (diisi tiap run, tidak tersimpan di file)"
        required: true
        type: string
        default: ""
      x86_level:
        description: "DOD3_X86_LEVEL: x86-64-v2 = AVX (Sandy Bridge / i7-2600)"
        type: string
        default: "x86-64-v2"
      jobs:
        description: "Parallel compile jobs (Gunakan 1 atau 2 agar tidak Out of Memory)"
        type: string
        default: "1"
      symbols:
        description: "DOD3_SYMBOLS (OFF = hemat memori & ukuran kecil)"
        type: boolean
        default: false
      package:
        description: "Jalankan package_win.sh"
        type: boolean
        default: true
      version:
        description: "Label versi ZIP"
        type: string
        default: "0.2.5-avx"

permissions:
  contents: read

concurrency:
  group: dod3-avx-build
  cancel-in-progress: false

jobs:
  build-avx:
    name: Build dod3.exe (AVX, Cloud Hosted)
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      VCPKG_TARGET_TRIPLET: x64-windows

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Workflow version marker
        shell: pwsh
        run: |
          Write-Host "WORKFLOW build-avx-cloud v8 (zlib DLL discovery zlib*.dll + stage runtime DLLs + dedicated vcpkg clone + Verify LASTEXITCODE fix)"

      - name: MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup LLVM / clang-cl
        shell: pwsh
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\Program Files\LLVM\bin\clang-cl.exe") {
              Write-Host "Menambahkan LLVM ke PATH..."
              "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              Write-Host "Menginstall LLVM via Choco..."
              choco install llvm -y --no-progress
              "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Install vcpkg (dedicated clone) + Dependencies
        shell: pwsh
        run: |
          # v5: JANGAN pakai vcpkg bawaan VS 18 (VCPKG_INSTALLATION_ROOT =
          # VC\vcpkg). Run v4 membuktikan file SDL2 yang ter-install di sana
          # hilang sebelum Configure (verifikasi vcpkg lolos, tapi step debug
          # bilang share/sdl2 tidak ada) — VS mengelola installed-nya sebagai
          # cache. Clone vcpkg sendiri ke C:\vcpkg-dod3 (di luar jangkauan
          # VS) dan pakai clone itu untuk semuanya.
          $vcpkgRoot = "C:\vcpkg-dod3"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$vcpkgRoot" -Encoding utf8

          if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            if (Test-Path $vcpkgRoot) { Remove-Item -Recurse -Force $vcpkgRoot }
            Write-Host "Cloning vcpkg ke $vcpkgRoot..."
            git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkgRoot
            if ($LASTEXITCODE -ne 0) {
              Write-Error "git clone vcpkg gagal (exit code $LASTEXITCODE)."
              exit $LASTEXITCODE
            }
            Write-Host "Bootstrap vcpkg..."
            & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE -ne 0) {
              Write-Error "bootstrap-vcpkg gagal (exit code $LASTEXITCODE)."
              exit $LASTEXITCODE
            }
          }

          Write-Host "Menginstall zlib dan sdl2 lewat vcpkg clone (root: $vcpkgRoot)..."
          & "$vcpkgRoot\vcpkg.exe" install zlib:x64-windows sdl2:x64-windows
          # PowerShell TIDAK menggagalkan step kalau native command (vcpkg.exe)
          # exit non-zero — harus dicek manual, kalau tidak kegagalan install
          # diam-diam lolos dan baru ketahuan di Configure sebagai
          # "SDL2 not found".
          if ($LASTEXITCODE -ne 0) {
            Write-Error "vcpkg install gagal (exit code $LASTEXITCODE). Lihat log di atas."
            exit $LASTEXITCODE
          }

          # Verifikasi keras: file yang dicari CMake harus benar-benar ada di
          # prefix clone. Kalau tidak ada, gagal DI SINI dengan pesan jelas,
          # bukan di Configure.
          $sdl2Header = "$vcpkgRoot\installed\x64-windows\include\SDL2\SDL.h"
          $sdl2Config = "$vcpkgRoot\installed\x64-windows\share\sdl2\SDL2Config.cmake"
          if (-not (Test-Path $sdl2Header)) {
            Write-Error "SDL2 header tidak ditemukan di $sdl2Header — vcpkg install tidak menghasilkan SDL2 di prefix ini."
            exit 1
          }
          if (-not (Test-Path $sdl2Config)) {
            Write-Error "SDL2Config.cmake tidak ditemukan di $sdl2Config."
            exit 1
          }
          Write-Host "SDL2 terverifikasi di $vcpkgRoot\installed\x64-windows"

      - name: Download & Validate EBOOT_101.ELF
        shell: pwsh
        run: |
          $url = "${{ inputs.eboot_url }}"
          if (-not $url) {
            Write-Error "Kolom eboot_url kosong. Isi dengan link download langsung EBOOT_101.ELF saat Run workflow, lalu re-run."
            exit 1
          }
          New-Item -ItemType Directory -Force -Path elf | Out-Null

          Write-Host "Mengunduh file EBOOT dari URL di input eboot_url..."
          # Menggunakan User-Agent browser agar tidak diblokir/dibatasi Dropbox
          curl.exe -L -f -A "Mozilla/5.0" -o elf/EBOOT_101.ELF $url

          if (-not (Test-Path elf/EBOOT_101.ELF)) {
            Write-Error "Gagal mendownload EBOOT_101.ELF."
            exit 1
          }

          $size = (Get-Item elf/EBOOT_101.ELF).Length
          Write-Host "Ukuran file terunduh: $size bytes"

          # FAIL-FAST: ukuran standar versi 1.01 decrypted = 26,872,424 bytes.
          # File HTML error Dropbox / file salah harus gagal DI SINI, bukan
          # di lift dengan pesan membingungkan.
          if ($size -ne 26872424) {
            Write-Error "Ukuran file $size bytes, bukan 26872424 (EBOOT 1.01 decrypted). Kemungkinan file HTML error / link salah / file bukan EBOOT 1.01."
            exit 1
          }

          $sha = (Get-FileHash elf/EBOOT_101.ELF -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256: $sha"
          if (-not $sha.StartsWith('ed89e80f2336a948')) {
            Write-Error "SHA-256 tidak cocok dengan EBOOT 1.01 yang didokumentasikan (prefix ed89e80f2336a948...). File salah — cek link di kolom eboot_url."
            exit 1
          }

      - name: Python venv + Requirements
        shell: pwsh
        run: |
          # WAJIB: tools/lift_spu.sh hanya mau .venv (tanpa fallback ke
          # system python). Venv dibuat sekali di sini, dipakai Lift PPU
          # dan Lift SPU.
          if (-not (Test-Path .venv/Scripts/python.exe)) {
            python -m venv .venv
          }
          .venv/Scripts/python.exe -m pip install --upgrade pip
          .venv/Scripts/python.exe -m pip install -r ps3recomp/tools/requirements.txt -r tools/requirements.txt

      - name: Lift PPU -> recompiled_101/
        shell: bash
        run: |
          PY=.venv/Scripts/python.exe
          "$PY" ps3recomp/tools/ppu_loader.py elf/EBOOT_101.ELF -o out/v101/
          "$PY" ps3recomp/tools/ppu_lifter.py elf/EBOOT_101.ELF \
            --functions out/v101/EBOOT_101.functions.json \
            --hle-stubs out/v101/EBOOT_101.imports.json \
            --code-end 0x157fc00 \
            --nonvolatile-locals \
            --hook 0x000C1E50 --hook 0x00EE7728 --hook 0x00272E58 \
            -o recompiled_101/

      - name: Lift SPU -> spu/
        shell: bash
        run: |
          bash tools/lift_spu.sh

      - name: Debug - list SDL2 files in vcpkg prefix
        shell: pwsh
        # Diagnostik murni: membuktikan file SDL2 ada di prefix PADA SAAT
        # Configure. continue-on-error agar diagnostik tidak pernah
        # menggagalkan build.
        continue-on-error: true
        run: |
          $prefix = "$env:VCPKG_ROOT\installed\x64-windows"
          Write-Host "Prefix: $prefix"
          Write-Host "--- share/sdl2 ---"
          Get-ChildItem "$prefix\share\sdl2" | Select-Object Name, Length
          Write-Host "--- include/SDL2 (first 8) ---"
          Get-ChildItem "$prefix\include\SDL2" | Select-Object -First 8 Name
          Write-Host "--- lib/SDL2* ---"
          Get-ChildItem "$prefix\lib" -Filter "SDL2*" | Select-Object Name, Length

      - name: Configure + Build (AVX)
        shell: pwsh
        env:
          DOD3_LEVEL: ${{ inputs.x86_level }}
          DOD3_JOBS: ${{ inputs.jobs }}
          DOD3_SYMBOLS_FLAG: ${{ inputs.symbols && 'ON' || 'OFF' }}
        run: |
          $recomp = ($PWD.Path + '/recompiled_101').Replace('\', '/')
          $toolchain = ($env:VCPKG_ROOT + '/scripts/buildsystems/vcpkg.cmake').Replace('\', '/')
          # Prefix eksplisit: ini obat yang disarankan pesan error-nya
          # sendiri ("pass -DCMAKE_PREFIX_PATH=<prefix>"). Tanpa ini CMake
          # hanya mengandalkan toolchain untuk mengekspos prefix vcpkg;
          # dengan ini find_package(SDL2) melihat installed dir secara
          # langsung, apa pun yang terjadi di toolchain.
          $vcpkgPrefix = ($env:VCPKG_ROOT + '/installed/x64-windows').Replace('\', '/')
          $sdl2Dir = "$vcpkgPrefix/share/sdl2"
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "CMAKE_PREFIX_PATH=$vcpkgPrefix"
          Write-Host "SDL2_DIR=$sdl2Dir"

          # Fail-fast di titik pakai: SDL2Config harus ada di prefix SAAT INI
          # (run v4: ada saat step vcpkg, hilang saat Configure). Kalau
          # hilang, gagal di sini dengan pesan jelas, bukan lewat error
          # find_package yang membingungkan.
          if (-not (Test-Path "$env:VCPKG_ROOT\installed\x64-windows\share\sdl2\SDL2Config.cmake")) {
            Write-Error "SDL2Config.cmake HILANG dari prefix $env:VCPKG_ROOT\installed\x64-windows saat Configure. Prefix vcpkg tidak bertahan antar-step."
            exit 1
          }

          cmake --debug-find-pkg=SDL2 -S . -B build-avx -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DCMAKE_PREFIX_PATH="$vcpkgPrefix" `
            -DSDL2_DIR="$sdl2Dir" `
            -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DDOD3_EBOOT=101 `
            -DRECOMP_DIR="$recomp" `
            -DDOD3_X86_LEVEL="$env:DOD3_LEVEL" `
            -DDOD3_SYMBOLS=$env:DOD3_SYMBOLS_FLAG

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          cmake --build build-avx -- -j $env:DOD3_JOBS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage runtime DLLs into build-avx
        shell: pwsh
        run: |
          # v7: DLL runtime HARUS ikut artifact. Artifact run v6 hanya
          # berisi dod3.exe telanjang -> error "DLL not found" saat
          # dijalankan (SDL2, zlib, VC redist tidak ada di sebelah exe).
          # Stage di sini (sebelum Verify): SDL2.dll + zlib DLL dari bin
          # vcpkg clone (lokasi deterministik), CRT DLL dari folder
          # Microsoft.VC*.CRT apa pun (package_win.sh hardcode VC143 — di
          # VS 18 foldernya bisa VC144/VC145), plus dod3.ini.
          $bin = "$env:VCPKG_ROOT\installed\x64-windows\bin"
          # SDL2.dll: nama pasti (terbukti ada di bin vcpkg di run v7).
          $sdl2 = Join-Path $bin 'SDL2.dll'
          if (-not (Test-Path $sdl2)) {
            Write-Error "Runtime DLL tidak ditemukan di $sdl2 — vcpkg install tidak menghasilkan SDL2.dll."
            exit 1
          }
          Copy-Item $sdl2 build-avx/ -Force
          Write-Host "Staged SDL2.dll"

          # zlib: nama DLL TIDAK di-hardcode. vcpkg bisa menghasilkan
          # zlib1.dll atau zlib.dll (run v7: zlib1.dll tidak ada di bin
          # padahal SDL2.dll ada). Cari pola zlib*.dll di build-avx/
          # (hasil applocal vcpkg saat Build) dulu, lalu di bin vcpkg.
          # Copy apa pun yang ketemu — nama import di exe selalu cocok
          # dengan nama file DLL dari install vcpkg yang sama.
          $zlibDll = Get-ChildItem "build-avx\zlib*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($zlibDll) {
            Write-Host ("zlib DLL sudah ada di build-avx/: " + $zlibDll.Name)
          } else {
            $zlibDll = Get-ChildItem "$bin\zlib*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $zlibDll) {
              Write-Error "DLL zlib tidak ditemukan di build-avx/ maupun di $bin (dicari zlib*.dll). vcpkg install tidak menghasilkan DLL zlib."
              exit 1
            }
            Copy-Item $zlibDll.FullName build-avx/ -Force
            Write-Host ("Staged " + $zlibDll.Name)
          }

          $crtDirs = Get-ChildItem "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory -ErrorAction SilentlyContinue | Sort-Object FullName
          if ($crtDirs) {
            $crt = $crtDirs[-1].FullName
            Write-Host "CRT folder: $crt"
            foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
              $src = Join-Path $crt $dll
              if (Test-Path $src) {
                Copy-Item $src build-avx/ -Force
                Write-Host "Staged $dll"
              } else {
                Write-Warning "CRT DLL $dll tidak ada di $crt."
              }
            }
          } else {
            Write-Warning "Folder Microsoft.VC*.CRT tidak ditemukan — CRT DLL tidak di-stage. PC tanpa VC Redist tidak bisa menjalankan exe."
          }

          if (Test-Path dod3.ini) {
            Copy-Item dod3.ini build-avx/ -Force
            Write-Host "Staged dod3.ini"
          }

      - name: Verify Binary
        shell: pwsh
        env:
          DOD3_LEVEL: ${{ inputs.x86_level }}
        run: |
          if (-not (Test-Path build-avx/dod3.exe)) {
            Write-Error "build-avx/dod3.exe tidak ditemukan."
            exit 1
          }

          $m = Select-String -Path build-avx/CMakeCache.txt -Pattern 'DOD3_X86_LEVEL:STRING=(.*)'
          if (-not $m) {
            Write-Error "DOD3_X86_LEVEL tidak ditemukan di build-avx/CMakeCache.txt."
            exit 1
          }
          $cached = $m.Matches.Groups[1].Value
          Write-Host "CMakeCache DOD3_X86_LEVEL=$cached (requested: $env:DOD3_LEVEL)"
          if ($cached -ne $env:DOD3_LEVEL) {
            Write-Error "CMakeCache level ($cached) != requested level ($env:DOD3_LEVEL). Hapus build-avx/ dan re-run."
            exit 1
          }

          # findstr exit 1 = string TIDAK ditemukan (= hasil yang
          # diinginkan). Tapi PowerShell mengembalikan $LASTEXITCODE sebagai
          # exit code script — tanpa reset, kode 1 itu bocor dan step ini
          # gagal walau semua cek lolos (itulah yang mematikan run v5).
          findstr /M /C:"needs a CPU with AVX2" build-avx\dod3.exe | Out-Null
          $gateFound = ($LASTEXITCODE -eq 0)
          $LASTEXITCODE = 0
          if ($gateFound) {
            Write-Error "Gate AVX2 masih terdeteksi di dalam exe!"
            exit 1
          }
          # v7: DLL runtime wajib ada di sebelah exe, kalau tidak exe
          # tidak bisa jalan di PC pemain (itulah error run v6).
          if (-not (Test-Path "build-avx/SDL2.dll")) {
            Write-Error "Runtime DLL SDL2.dll tidak ada di build-avx/ — exe tidak bisa jalan tanpa DLL ini."
            exit 1
          }
          # zlib: cek pola, bukan nama (bisa zlib1.dll atau zlib.dll).
          if (-not (Get-ChildItem "build-avx\zlib*.dll" -ErrorAction SilentlyContinue)) {
            Write-Error "DLL zlib (zlib*.dll) tidak ada di build-avx/ — exe tidak bisa jalan tanpa DLL ini."
            exit 1
          }
          foreach ($dll in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (-not (Test-Path "build-avx/$dll")) {
              Write-Warning "CRT DLL $dll tidak ada di build-avx/ — PC tanpa VC Redist tidak bisa menjalankan exe."
            }
          }
          Write-Host "Verifikasi lolos: dod3.exe dibuat untuk AVX (tanpa AVX2 lock)."
          exit 0

      - name: Package Release
        if: ${{ inputs.package }}
        shell: bash
        # Ephemeral runner: kalau packaging gagal, build 1-2 jam jangan ikut
        # hilang — dod3.exe tetap ke-upload di step berikutnya.
        continue-on-error: true
        run: |
          bash tools/package_win.sh "${{ inputs.version }}" build-avx

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dod3-recomp-${{ inputs.version }}-win64
          path: |
            dist/*.zip
            build-avx/dod3.exe
            build-avx/*.dll
            build-avx/dod3.ini
          if-no-files-found: error
