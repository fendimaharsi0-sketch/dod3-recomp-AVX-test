name: Build dod3 (AVX) - Cloud Runner

on:
  workflow_dispatch:
    inputs:
      eboot_url:
        description: "Direct download URL ke EBOOT_101.ELF"
        required: true
        type: string
        default: "https://www.dropbox.com/scl/fi/pzl6080ds8rb6l3cdu4o2/EBOOT.ELF?rlkey=i22xma318hp5yit26b1uin70d&st=i1v4dube&dl=1"
      x86_level:
        description: "DOD3_X86_LEVEL: x86-64-v2 = AVX (Sandy Bridge / i7-2600)"
        type: string
        default: "x86-64-v2"
      jobs:
        description: "Parallel compile jobs (Gunakan 1 atau 2 agar tidak Out of Memory)"
        type: string
        default: "1"
      symbols:
        description: "DOD3_SYMBOLS (OFF = hemat memori & ukuran kecil)"
        type: boolean
        default: false
      package:
        description: "Jalankan package_win.sh"
        type: boolean
        default: true
      version:
        description: "Label versi ZIP"
        type: string
        default: "0.2.5-avx"

permissions:
  contents: read

concurrency:
  group: dod3-avx-build
  cancel-in-progress: false

jobs:
  build-avx:
    name: Build dod3.exe (AVX, Cloud Hosted)
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      VCPKG_TARGET_TRIPLET: x64-windows

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup LLVM / clang-cl
        shell: pwsh
        run: |
          if (-not (Get-Command clang-cl -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\Program Files\LLVM\bin\clang-cl.exe") {
              Write-Host "Menambahkan LLVM ke PATH..."
              "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              Write-Host "Menginstall LLVM via Choco..."
              choco install llvm -y --no-progress
              "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }

      - name: Install vcpkg Dependencies
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$vcpkgRoot" -Encoding utf8
          
          Write-Host "Menginstall zlib dan sdl2 lewat vcpkg..."
          & "$vcpkgRoot\vcpkg.exe" install zlib:x64-windows sdl2:x64-windows

      - name: Download & Validate EBOOT_101.ELF
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path elf | Out-Null
          
          Write-Host "Mengunduh file EBOOT dari Dropbox..."
          # Menggunakan User-Agent browser agar tidak diblokir/dibatasi Dropbox
          curl.exe -L -f -A "Mozilla/5.0" -o elf/EBOOT_101.ELF "${{ inputs.eboot_url }}"
          
          if (-not (Test-Path elf/EBOOT_101.ELF)) {
            Write-Error "Gagal mendownload EBOOT_101.ELF dari link Dropbox."
            exit 1
          }

          $size = (Get-Item elf/EBOOT_101.ELF).Length
          Write-Host "Ukuran file terunduh: $size bytes"
          
          # Cek ukuran standar versi 1.01 decrypted (26,872,424 bytes)
          if ($size -ne 26872424) {
            Write-Warning "PERINGATAN: Ukuran file adalah $size bytes (standar EBOOT 1.01 decrypted adalah 26,872,424 bytes). Pastikan file bukan file HTML error dari Dropbox."
          }

          $sha = (Get-FileHash elf/EBOOT_101.ELF -Algorithm SHA256).Hash.ToLower()
          Write-Host "SHA-256: $sha"

      - name: Install Python Requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ps3recomp/tools/requirements.txt -r tools/requirements.txt

      - name: Lift PPU -> recompiled_101/
        shell: bash
        run: |
          python ps3recomp/tools/ppu_loader.py elf/EBOOT_101.ELF -o out/v101/
          python ps3recomp/tools/ppu_lifter.py elf/EBOOT_101.ELF \
            --functions out/v101/EBOOT_101.functions.json \
            --hle-stubs out/v101/EBOOT_101.imports.json \
            --code-end 0x157fc00 \
            --nonvolatile-locals \
            --hook 0x000C1E50 --hook 0x00EE7728 --hook 0x00272E58 \
            -o recompiled_101/

      - name: Lift SPU -> spu/
        shell: bash
        run: |
          bash tools/lift_spu.sh

      - name: MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure + Build (AVX)
        shell: pwsh
        env:
          DOD3_LEVEL: ${{ inputs.x86_level }}
          DOD3_JOBS: ${{ inputs.jobs }}
          DOD3_SYMBOLS_FLAG: ${{ inputs.symbols && 'ON' || 'OFF' }}
        run: |
          $recomp = ($PWD.Path + '/recompiled_101').Replace('\', '/')
          $toolchain = ($env:VCPKG_ROOT + '/scripts/buildsystems/vcpkg.cmake').Replace('\', '/')
          
          cmake -S . -B build-avx -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DDOD3_EBOOT=101 `
            -DRECOMP_DIR="$recomp" `
            -DDOD3_X86_LEVEL="$env:DOD3_LEVEL" `
            -DDOD3_SYMBOLS=$env:DOD3_SYMBOLS_FLAG

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          
          cmake --build build-avx -- -j $env:DOD3_JOBS
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Binary
        shell: pwsh
        env:
          DOD3_LEVEL: ${{ inputs.x86_level }}
        run: |
          if (-not (Test-Path build-avx/dod3.exe)) {
            Write-Error "build-avx/dod3.exe tidak ditemukan."
            exit 1
          }

          findstr /M /C:"needs a CPU with AVX2" build-avx\dod3.exe | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Error "Gate AVX2 masih terdeteksi di dalam exe!"
            exit 1
          }
          Write-Host "Verifikasi lolos: dod3.exe dibuat untuk AVX (tanpa AVX2 lock)."

      - name: Package Release
        if: ${{ inputs.package }}
        shell: bash
        run: |
          bash tools/package_win.sh "${{ inputs.version }}" build-avx

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dod3-recomp-${{ inputs.version }}-win64
          path: |
            dist/*.zip
            build-avx/dod3.exe
          if-no-files-found: error
